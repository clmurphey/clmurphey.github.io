<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ site.Params.description }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mdbootstrap@4.20.0/css/mdb.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/academicons@1.9.1/css/academicons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="shortcut icon" href="/assets/img/favicon.ico">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/custom.css">
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/dark_mode.js"></script>
</head>
<body class="fixed-top-nav sticky-bottom-footer">
  {{ partial "header.html" . }}
  <div class="container mt-5">
    {{ block "main" . }}{{ end }}
  </div>
  <footer class="sticky-bottom mt-5">
    <div class="container">
      &copy; Copyright {{ now.Year }} {{ site.Params.first_name }} {{ site.Params.last_name }}. Powered by <a href="https://gohugo.io/" target="_blank">Hugo</a>. Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>. Design adapted from the <a href="https://github.com/alshedivat/al-folio" target="_blank">al-folio</a> theme.
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/imagesloaded@4/imagesloaded.pkgd.min.js"></script>
  <script src="/assets/js/masonry.js"></script>
  <script src="/assets/js/common.js"></script>
</body>
</html>
